name: Run Tests

on:
  push:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install LLVM
        run: |
          sudo apt update
          sudo apt install -y clang-22 llvm-22
      - name: Symlink LLVM
        run: |
          sudo ln -sf /usr/bin/llvm-config-22 /usr/local/bin/llvm-config
          sudo ln -sf /usr/bin/clang-22 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
      - name: Make the script executable
        run: chmod +x ./tests.sh
      - name: Run tests
        run: ./tests.sh
